# =====================================================================
# Docker Compose - Despliegue en VM PUCP
# El tunel SSH esta integrado dentro del contenedor backend.
# =====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantilla-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    # ── Límites de memoria ──────────────────────────────────────────────────────────────────────────────
    # mem_limit: techo duro — 768m.
    # MaxRAMPercentage=35% → heap máximo ≈ 269 MB.
    # Metaspace (160m) + heap (269m) + JVM overhead (~80m) + SSH (~30m) ≈ 539m < 768m.
    # Se bajó heap de 40% → 35% para ceder espacio a Metaspace (27 repos JPA + Hibernate 6).
    mem_limit: 768m
    mem_reservation: 384m
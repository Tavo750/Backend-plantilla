# =====================================================================
# Docker Compose - Despliegue en VM PUCP
# El tunel SSH esta integrado dentro del contenedor backend.
# =====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantilla-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
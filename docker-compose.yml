# =====================================================================
# Docker Compose - Despliegue en VM PUCP
# El tunel SSH esta integrado dentro del contenedor backend.
# =====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantilla-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    # ── Límites de memoria ──────────────────────────────────────────────────────────────────────────────
    # mem_limit: techo duro — subido de 512m a 768m.
    # Con UseContainerSupport, el heap máximo será el 40% de 768m = ~307 MB.
    # Metaspace (96m) + heap (307m) + JVM overhead (~80m) + SSH (~30m) ≈ 513m < 768m.
    mem_limit: 768m
    mem_reservation: 384m
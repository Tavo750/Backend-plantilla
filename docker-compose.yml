# =====================================================================
# Docker Compose - Despliegue en VM PUCP
# El tunel SSH esta integrado dentro del contenedor backend.
# No se necesita contenedor separado de base de datos.
# =====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantilla-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Credenciales del tunel SSH (leidas por docker-start.sh)
      SSHPASS: ${SSH_PASSWORD}
      SSH_HOST: ${SSH_HOST}
      SSH_USER: ${SSH_USER}
      SSH_PORT: ${SSH_PORT:-22}
# =====================================================================
# Configuración de la Aplicación - Spring Boot
# Lee variables desde el archivo .env mediante spring-dotenv
# =====================================================================

server:
  port: ${SERVER_PORT:3000}
  servlet:
    context-path: /api

# =====================================================================
# Spring Data Source - MySQL
# =====================================================
# Spring Data Source - MySQL
# =====================================================================
spring:
  config:
    import: optional:file:.env[.properties], optional:file:.env
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plantilla_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plantilla_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000      # Tiempo máximo esperando conexión del pool (30 s)
      maximum-pool-size: 10          # Conexiones máximas simultáneas
      minimum-idle: 2                # Mínimo de conexiones siempre activas en el pool
      idle-timeout: 300000           # Retira conexiones ociosas tras 5 min
      max-lifetime: 580000           # Vida máxima de cada conexión: 9 min 40 s
      idle-timeout: 300000           # Retira conexiones ociosas tras 5 min
      max-lifetime: 580000           # Vida máxima de cada conexión: 9 min 40 s
      validation-timeout: 5000       # Tiempo para validar una conexión antes de entregarla (5 s)

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25             # Agrupa hasta 25 INSERTs/UPDATEs en un solo round-trip a la BD
          batch_versioned_data: true
        order_inserts: true          # Reordena inserts para maximizar el batching
        order_updates: true          # Reordena updates para maximizar el batching

  # Cache
  cache:
    type: simple

  # MVC / Async — sin límite de tiempo para peticiones SSE de larga duración (simulaciones multi-día)
  mvc:
    async:
      request-timeout: -1

# =====================================================================
# JWT
# =====================================================================
jwt:
  secret: ${JWT_SECRET:clave-secreta-super-segura-para-jwt-debe-tener-al-menos-256-bits-de-longitud-2024}
  expiration: ${JWT_EXPIRATION:86400000}

# =====================================================================
# CORS
# =====================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================================================================
# OpenAPI / Swagger
# =====================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# =====================================================================
# Logging
# =====================================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.plantilla.backend: DEBUG
    org.springframework.security: WARN

# =====================================================================
# Configuración de la Aplicación - Spring Boot
# Lee variables desde el archivo .env mediante spring-dotenv
# =====================================================================

server:
  port: ${SERVER_PORT:3000}
  servlet:
    context-path: /api

# =====================================================================
# Spring Data Source - PostgreSQL
# =====================================================================
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:Backend-plantilla/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plantilla_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000      # Tiempo máximo esperando conexión del pool (20 s)
      maximum-pool-size: 5           # Aumentado de 3→5 para tolerar picos de carga
      minimum-idle: 2                # 2 conexiones permanentes en reposo
      idle-timeout: 300000           # Retira conexiones ociosas tras 5 min
      max-lifetime: 580000           # Vida máxima de cada conexión: 9 min 40 s
      validation-timeout: 5000       # Tiempo para validar una conexión antes de entregarla (5 s)
      leak-detection-threshold: 20000 # Alerta si una conexión se retiene > 20 s (detecta N+1)

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Cache
  cache:
    type: simple

# =====================================================================
# JWT 
# =====================================================================
jwt:
  secret: ${JWT_SECRET:clave-secreta-super-segura-para-jwt-debe-tener-al-menos-256-bits-de-longitud-2024}
  expiration: ${JWT_EXPIRATION:86400000}

# =====================================================================
# CORS
# =====================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================================================================
# OpenAPI / Swagger
# =====================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# =====================================================================
# Logging
# =====================================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.plantilla.backend: DEBUG
    org.springframework.security: WARN
